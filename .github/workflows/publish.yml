name: 发布文章（Issue）

on:
  issues:
    types: [opened, labeled, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue 编号（补发或重跑）
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  publish:
    # 只有仓库所有者本人开的、且带「发布」标签的 issue 才会落到仓库里。
    # author_association == 'OWNER' 是 GitHub 自己判定的身份，改用户名或换账号都绕不过；
    # workflow_dispatch 只有写权限者能触发，脚本里还会再核一次作者。
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
      github.event.issue.author_association == 'OWNER' &&
      contains(github.event.issue.labels.*.name, '发布'))
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.commit.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 解析 issue
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          SLUG_FILE: ${{ runner.temp }}/slug.txt
        run: |
          python scripts/issue_to_post.py
          if [ -f "$SLUG_FILE" ]; then
            echo "slug=$(cat "$SLUG_FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交
        id: commit
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changes=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "post: issue #$ISSUE"
          # 同一 issue 可能被并发触发（改正文 + 手动重跑），推之前先对齐远端
          for i in 1 2 3; do
            if git push; then break; fi
            git pull --rebase --autostash origin main
            sleep 3
          done
          git push --set-upstream origin main
          echo "changes=1" >> "$GITHUB_OUTPUT"

      - name: 回执并收口
        if: steps.build.outputs.slug != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          SLUG: ${{ steps.build.outputs.slug }}
          CHANGES: ${{ steps.commit.outputs.changes }}
        run: |
          URL="https://frostsnow35.github.io/posts/$SLUG/"
          if [ "$CHANGES" = "1" ]; then
            MSG="已发布：$URL （构建约 1 分钟）"
          else
            MSG="内容没有变化，未产生新提交。$URL"
          fi
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "$MSG"
          gh issue edit "$ISSUE" --repo "${{ github.repository }}" --add-label "已发布"
          gh issue close "$ISSUE" --repo "${{ github.repository }}"

  # 机器人用 GITHUB_TOKEN 提交的 push 不会触发 deploy.yml，
  # 所以这里自己构建并发布一次，否则文章要等下一次人工推送才上线
  deploy:
    needs: publish
    if: needs.publish.outputs.changes == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
